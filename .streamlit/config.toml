# Main page: cool off-white with navy text. Sidebar: the deep navy / gold of the MedVisionAI pitch deck.
[theme]
base = "light"
primaryColor = "#1B2246"
backgroundColor = "#F4F6FB"
secondaryBackgroundColor = "#EEF0F6"
textColor = "#131837"
borderColor = "#E5E8F1"
font = "sans serif"
baseRadius = "12px"

[theme.sidebar]
primaryColor = "#C9A86A"
backgroundColor = "#1B2246"
secondaryBackgroundColor = "#232B55"
textColor = "#E9E2D2"
borderColor = "#2E3768"

[server]
maxUploadSize = 10          # MB, keep in sync with MAX_UPLOAD_MB in medvision/config.py
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false

[runner]
magicEnabled = false
